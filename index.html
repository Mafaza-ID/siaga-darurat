<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;color:#333;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:linear-gradient(#6fc3ff,#cdefff 55%,#fff3d1)}
body.play{background:linear-gradient(#ff9e80,#ffd0bd 50%,#fff0b3)}
button{font-family:inherit;cursor:pointer}
/* ---------- dekorasi latar ---------- */
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;left:-15%;font-size:64px;opacity:.9;animation:drift 38s linear infinite}
.cloud.c1{top:14%;animation-duration:44s}.cloud.c2{top:30%;font-size:44px;animation-duration:30s;animation-delay:-12s}.cloud.c3{top:6%;font-size:52px;animation-duration:56s;animation-delay:-30s}
body.play .cloud{opacity:.55}
@keyframes drift{to{left:112%}}
.sun{position:absolute;top:2.5%;left:3%;font-size:84px;animation:spin 30s linear infinite;filter:drop-shadow(0 0 18px #ffe082)}
body.play .sun{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#roadstrip{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;overflow:hidden}
body.play #roadstrip{display:none}
#roadstrip .rs-grass{position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(#a5e08f,#7ccf6c)}
#roadstrip .rs-scn{position:absolute;top:0;left:0;white-space:nowrap;font-size:34px;line-height:40px;animation:scn 40s linear infinite;z-index:0}
#roadstrip .rs-scn span{display:inline-block;margin-right:46px;animation:sway2 3s ease-in-out infinite alternate}
#roadstrip .rs-scn span:nth-child(3n){animation-delay:-1s}#roadstrip .rs-scn span:nth-child(3n+1){animation-delay:-2s}
@keyframes scn{to{transform:translateX(-50%)}}
@keyframes sway2{to{transform:translateY(-4px) rotate(4deg)}}
#roadstrip .rs-road{position:absolute;left:0;right:0;top:46px;bottom:0;background:linear-gradient(#6b6b6b,#4a4a4a 12%,#4a4a4a 88%,#3a3a3a);border-top:5px solid #e0e0e0}
#roadstrip .rs-dash{position:absolute;left:0;right:0;top:calc(46px + 5px + 32px);height:6px;background:repeating-linear-gradient(90deg,#ffd54f 0 38px,transparent 38px 76px);animation:dash 1.2s linear infinite;z-index:0}
@keyframes dash{to{background-position:-76px 0}}
#roadstrip img{position:absolute;width:auto;left:-20%;z-index:2;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 4px 2px rgba(0,0,0,.45))}
#roadstrip img.up{bottom:44px;height:42px;animation:drv 16s linear infinite,bounceC .5s ease-in-out infinite alternate}
#roadstrip img.dn{bottom:8px;height:50px;animation:drvL 12s linear infinite,bounceC .4s ease-in-out infinite alternate}
@keyframes drv{from{left:-20%}to{left:115%}}
@keyframes drvL{from{left:115%}to{left:-20%}}
@keyframes bounceC{to{margin-bottom:3px}}
#roadstrip img.dn{transform:scaleX(-1)}
#roadstrip img.jump{animation-play-state:running;transform:translateY(-14px) rotate(-4deg)}
#roadstrip img.dn.jump{transform:scaleX(-1) translateY(-14px) rotate(4deg)}
#roadstrip .rs-fx{position:absolute;z-index:3;font-size:22px;pointer-events:none;animation:fxup 1.1s ease-out forwards;font-weight:700}
#roadstrip .rs-fx.tx{font-size:15px;background:#fff;color:#ff5722;border:2px solid #ff5722;border-radius:12px;padding:1px 8px}
@keyframes fxup{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-46px) scale(1.2)}}
#roadstrip .rs-hint{position:absolute;right:10px;top:50px;z-index:3;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border-radius:10px;padding:2px 8px}
#top{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:150}
#top button{width:46px;height:46px;border-radius:50%;border:3px solid #ff5722;background:#fff;font-size:21px;box-shadow:0 4px 0 #d6d6d6;transition:transform .1s}
#top button:active{transform:translateY(3px);box-shadow:0 1px 0 #d6d6d6}
#top button.off{opacity:.5;background:#eee}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-20px);background:#333;color:#fff;padding:10px 22px;border-radius:24px;font-weight:600;z-index:400;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.screen{display:none;position:absolute;inset:0;overflow:auto}
.screen.active{display:flex}
.big{position:relative;border:3px solid rgba(255,255,255,.75);color:#fff;font-weight:700;font-size:20px;padding:12px 22px;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .1s;background-image:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 55%);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
@media(hover:hover){.big:hover{transform:translateY(-3px) scale(1.03)}.big:active{transform:translateY(5px)}}
.green{background-color:#43b84a}.blue{background-color:#2196f3}.red{background-color:#f44336}.purple{background-color:#9c27b0}.orange{background-color:#ff9800}
/* ---------- MENU ---------- */
#menu{align-items:center;justify-content:center;flex-direction:column;padding:62px 16px 100px}
.card{position:relative;background:rgba(255,255,255,.94);border:6px solid #fff;border-radius:36px;padding:22px 30px 26px;box-shadow:0 14px 0 rgba(0,0,0,.08),0 20px 40px rgba(0,0,0,.15);text-align:center;max-width:900px;width:100%}
.title{font-size:clamp(40px,7.5vw,80px);line-height:1;margin:0;font-weight:700}
.title span{display:inline-block;-webkit-text-stroke:7px #fff;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.18);animation:letter 1.8s ease-in-out infinite}
@keyframes letter{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.tag{display:inline-block;margin:12px 0;background:linear-gradient(#ff7043,#f4511e);color:#fff;padding:8px 26px;border-radius:30px;font-weight:700;transform:rotate(-1.5deg);box-shadow:0 5px 0 #b93d14}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.hero img{height:62px;width:auto;max-width:22%;object-fit:contain;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 5px 3px rgba(0,0,0,.25))}
.hero img:nth-child(2){animation-delay:.2s}.hero img:nth-child(3){animation-delay:.4s}.hero img:nth-child(4){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px)}}
.menuBtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px;margin-top:6px}
.menuBtns button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;font-size:22px}
.menuBtns small{font-size:12px;background:rgba(0,0,0,.25);padding:2px 10px;border-radius:10px}
.menuBtns .ic{font-size:40px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
#help{position:fixed;top:10px;left:10px;z-index:150;border:3px solid #2196f3;background:#fff;color:#2196f3;font-weight:700;font-size:17px;padding:8px 16px;border-radius:18px;box-shadow:0 4px 0 #cfd8dc}
#help:active{transform:translateY(3px);box-shadow:0 1px 0 #cfd8dc}
.credit{position:relative;margin-top:16px;background:#fff;border-radius:30px;padding:8px 22px;font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.1);text-align:center}
/* ---------- PILIH KARAKTER ---------- */
#chars{flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:60px 14px 0}
.pill{background:#fff;border:5px solid #ff5722;border-radius:24px;padding:10px 40px;font-size:clamp(24px,4vw,40px);font-weight:700;color:#ff5722;box-shadow:0 6px 0 rgba(0,0,0,.12);text-align:center;flex:none}
.crows{display:flex;flex-direction:column;gap:12px;width:min(1100px,100%)}
.crow{display:flex;align-items:stretch;gap:10px;background:rgba(255,255,255,.5);border-radius:24px;padding:10px;border:3px solid #fff}
.clabel{display:grid;place-items:center;background:var(--pc,#ffeb3b);color:#fff;font-weight:700;border-radius:16px;padding:0 12px;min-width:84px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ccard{--tc:#999;position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:linear-gradient(#fff,color-mix(in srgb,var(--tc) 20%,#fff));border:4px solid var(--tc);border-radius:20px;padding:8px 6px;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 70%,#000);color:#333;transition:transform .12s}
.ccard .cv{width:100%;height:clamp(44px,9vh,96px);object-fit:contain;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.ccard b{font-size:clamp(13px,1.6vw,19px)}
.ccard .cd{display:flex;align-items:center;gap:6px;color:#555;font-size:12px;font-weight:600}
.ccard .cd img{height:clamp(26px,5vh,46px);width:auto;max-width:60px;object-fit:contain}
.ccard.sel{transform:translateY(-4px) scale(1.04);border-color:#2e7d32;background:linear-gradient(#f1fff1,#b9f6ca);box-shadow:0 8px 0 #2e7d32}
.ccard.sel::after{content:'✔';position:absolute;top:-12px;right:-10px;width:32px;height:32px;border-radius:50%;background:#43a047;color:#fff;display:grid;place-items:center;font-weight:700;border:3px solid #fff;animation:pop2 .25s}
.ccard.sel .cv{animation:bob 1.2s ease-in-out infinite}
.ccard:active{transform:translateY(2px)}
.btns2{display:flex;gap:16px;justify-content:center;position:sticky;bottom:0;width:100%;padding:12px 0 14px;margin-top:auto;background:linear-gradient(rgba(255,208,189,0),#ffd0bd 45%);flex:none}
#chars.one{justify-content:center}
#chars.one .crows{flex:none}
#chars.one .ccard{padding:16px 8px;gap:8px}
#chars.one .ccard .cv{height:clamp(70px,18vh,160px)}
#chars.one .ccard b{font-size:clamp(15px,1.9vw,24px)}
#chars.one .ccard .cd{font-size:14px}
#chars.one .ccard .cd img{height:clamp(36px,8vh,80px);max-width:120px}
#chars.multi .ccard .cv{height:clamp(34px,6vh,60px)}
#chars.multi .ccard .cd small{display:none}
.pturn{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:none}
.pchip{background:#fff;color:var(--pc);border:3px solid var(--pc);border-radius:20px;padding:5px 14px;font-weight:700;font-size:15px;opacity:.7;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.pchip.on{background:var(--pc);color:#fff;opacity:1;transform:scale(1.1)}
.ccard.mp.sel::after{display:none}
.ptags{position:absolute;top:-14px;left:0;right:0;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;z-index:2}
.ptags i{font-style:normal;background:var(--pc);color:#fff;border:2px solid #fff;border-radius:14px;padding:2px 9px;font-size:13px;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.3);animation:pop2 .25s}
#chars:not(.one) .crows{flex:none}
#chars:not(.one){justify-content:center}
#chars:not(.one) .ccard{padding:16px 8px;gap:8px}
#chars:not(.one) .ccard .cv{height:clamp(70px,18vh,160px)}
#chars:not(.one) .ccard b{font-size:clamp(15px,1.9vw,24px)}
#chars:not(.one) .ccard .cd img{height:clamp(36px,8vh,80px);max-width:120px}
@media(max-width:560px){#chars{padding-top:64px}.pill{padding:6px 18px;font-size:22px}#chars .ccard .cd small{display:none}#chars .ccard .cd img{height:44px!important;max-width:100%!important}#chars .ccard .cd{font-size:0}#chars .ccard .cd img{font-size:12px}#chars:not(.one) .ccard .cv,#chars.one .ccard .cv{height:clamp(50px,11vh,90px)}#chars .ccard{padding:14px 4px 8px!important;flex:1 1 42%}#chars .pill{margin-right:0}}
/* ---------- LEVEL ---------- */
#levels{flex-direction:column;align-items:center;gap:20px;padding:62px 16px 30px}
.lvgrid{display:grid;grid-template-columns:repeat(5,88px);gap:20px;background:rgba(255,255,255,.55);padding:34px;border-radius:30px;border:4px solid #fff}
.lv{height:88px;border-radius:20px;border:5px solid #ff9800;background:linear-gradient(#ffe082,#ffb300);color:#e64a19;font-size:34px;font-weight:700;box-shadow:0 8px 0 #ff6d00;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.lv small{font-size:16px;margin-top:3px;min-height:18px;letter-spacing:-2px}
.lv:active{transform:translateY(5px);box-shadow:0 3px 0 #ff6d00}
.lv.lock{background:linear-gradient(#e0e0e0,#9e9e9e);border-color:#9e9e9e;box-shadow:0 8px 0 #757575;font-size:30px;cursor:not-allowed}
/* ---------- GAME ---------- */
#game{flex-direction:column}
.panel{--pc:#fff;background:rgba(255,255,255,.62);border:5px solid var(--pc);border-radius:28px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:8px;width:100%}
.rbtn{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#ff6d00;font-size:21px;font-weight:700;box-shadow:0 4px 0 #ff9800;flex:none;display:grid;place-items:center;padding:0}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #ff9800}
.rbtn.home{background:#f44336;box-shadow:0 4px 0 #b71c1c}
.rbtn.blue{background:#2196f3;color:#fff;box-shadow:0 4px 0 #0d47a1}
.rbtn.yel{background:#ffeb3b;box-shadow:0 4px 0 #f9a825}
.chip{background:#ffeb3b;color:#e64a19;font-weight:700;padding:4px 18px;border-radius:16px;box-shadow:0 3px 0 #fbc02d;margin:0 auto;text-align:center}
.score{background:#388e3c;color:#fff;font-weight:700;padding:3px 14px;border-radius:14px;font-size:14px;white-space:nowrap}
.savebtn{background:#fff;border:3px solid #cfd8dc;border-radius:22px;padding:6px 14px;font-size:15px;font-weight:700;color:#455a64;box-shadow:0 4px 0 #cfd8dc;white-space:nowrap;flex:none}
.savebtn:active{transform:translateY(3px);box-shadow:0 1px 0 #cfd8dc}
.solo{margin:auto;width:min(96vw,1000px);justify-content:flex-start;padding:12px 18px 16px;--gs:min(calc(100vh - 285px),92vw,780px)}
.hud{background:#333;height:70px;border-bottom:3px solid #f44336;display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;font-size:34px;font-weight:700;position:relative;flex:none}
.hud b{color:#ffd600;text-shadow:0 0 12px #ffab00}
.hud .exit{position:absolute;left:14px;background:#f44336;color:#fff;border:2px solid #fff;border-radius:10px;font-size:15px;padding:9px 16px;font-weight:700;box-shadow:0 3px 0 #b71c1c}
.panels{flex:1;display:flex;gap:2%;padding:1.2vh 1.2vw;justify-content:center;min-height:0;overflow:auto}
.panels .panel{flex:1;max-width:48%;align-self:flex-start}
.panels.n4 .panel{max-width:24%;padding:8px}
.panels.n2{--gs:min(40vw,56vh)}
.panels.n4{--gs:min(20vw,44vh)}
.panels.n4 .chip{font-size:12px;padding:3px 8px}
.panels.n4 .score{font-size:12px;padding:2px 8px}
.panels.n4 .item{width:clamp(30px,3vw,54px)!important;height:clamp(30px,3vw,54px)!important}
.panel.pl .chip{background:var(--pc);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.bh{width:100%}
.tbar{position:relative;width:var(--gs);height:24px;border-radius:14px;background:#d9d9d9;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.25);border:3px solid #fff}
.tfill{height:100%;width:100%;background:#4caf50;transition:width .12s linear,background .3s;background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.tfill.blink{animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.55}}
.ttxt{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
/* papan */
.grid{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));width:var(--gs);height:var(--gs);border:8px solid #4caf50;box-shadow:0 8px 0 #2e7d32,0 14px 20px rgba(0,0,0,.15);border-radius:18px;
 background:radial-gradient(circle at 25% 35%,rgba(255,255,255,.28) 0 3px,transparent 4px),radial-gradient(circle at 75% 70%,rgba(255,255,255,.22) 0 2.5px,transparent 3.5px),repeating-linear-gradient(45deg,#8ad98f 0 16px,#7fd085 16px 32px);background-size:44px 44px,52px 52px,auto}
.cell,.slot{position:relative;min-width:0;min-height:0}
.cell>svg,.slot>svg{position:absolute;left:-.5px;top:-.5px;width:calc(100% + 1px);height:calc(100% + 1px);display:block}
.deco{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--gs) / var(--n) * .52);line-height:1;pointer-events:none;transform-origin:50% 90%;animation:sway 3.4s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
@keyframes sway{50%{transform:rotate(4deg) scale(1.04)}}
.slot .ph{position:absolute;inset:7%;border:3px dashed #fff;border-radius:14px;background:rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;font-weight:700;font-size:clamp(14px,2.4vw,30px);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.grid.armed .slot .ph{animation:armed .8s ease-in-out infinite alternate;background:rgba(255,255,255,.6)}
@keyframes armed{to{transform:scale(1.07);box-shadow:0 0 0 4px #fff8}}
.slot.hint .ph{animation:armed .35s ease-in-out infinite alternate;background:#fff59d;border-color:#f9a825;color:#f57f17}
.dest{position:absolute;inset:0;width:100%;height:100%;padding:0;--ds:1.5;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));z-index:4;pointer-events:none;transform:scale(var(--ds))}
.car{--f:1;--cs:1.7;position:absolute;padding:0;object-fit:contain;z-index:3;pointer-events:none;transition:left .28s linear,top .28s linear;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));transform:scaleX(var(--f)) scale(var(--cs))}
.car.idle{animation:idleC 1s ease-in-out infinite alternate}
@keyframes idleC{to{transform:scaleX(var(--f)) scale(var(--cs)) translateY(-3px)}}
.car.shake{animation:shakeC .5s 2}
@keyframes shakeC{25%{transform:scaleX(var(--f)) scale(var(--cs)) translateX(-4px) rotate(-3deg)}75%{transform:scaleX(var(--f)) scale(var(--cs)) translateX(4px) rotate(3deg)}}
.dest.shake{animation:shakeD .5s 2}
@keyframes shakeD{25%{transform:scale(var(--ds)) translateX(-5px) rotate(-3deg)}75%{transform:scale(var(--ds)) translateX(5px) rotate(3deg)}}
.dest.happy{animation:pop .7s}
@keyframes pop{50%{transform:scale(calc(var(--ds,1.2)*1.2))}}
.sos{position:absolute;top:-16%;right:-4%;z-index:6;background:#fff;color:#e53935;font-weight:700;font-size:clamp(9px,calc(var(--gs) / var(--n) * .17),17px);padding:2px 9px;border-radius:14px;border:2.5px solid #e53935;animation:sosb .7s ease-in-out infinite alternate;pointer-events:none;white-space:nowrap}
.sos::after{content:'';position:absolute;left:14px;bottom:-9px;border:6px solid transparent;border-top-color:#e53935}
@keyframes sosb{to{transform:translateY(-4px) rotate(3deg)}}
.puff{position:absolute;display:grid;place-items:center;z-index:2;font-size:calc(var(--gs) / var(--n) * .4);animation:puff .7s forwards;pointer-events:none}
@keyframes puff{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.5) translateY(-10px)}}
.burst{position:absolute;inset:-20%;display:grid;place-items:center;font-size:calc(var(--gs) / var(--n) * .9);z-index:7;pointer-events:none;animation:burst 1s forwards}
@keyframes burst{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.inv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff8e1;border:4px solid #ffc107;border-radius:20px;padding:10px;max-width:100%;box-shadow:0 5px 0 #f9a825}
.item{position:relative;width:clamp(44px,5vw,66px);height:clamp(44px,5vw,66px);background:#fff;border-radius:12px;cursor:grab;touch-action:none;box-shadow:0 3px 0 #e0e0e0;transition:transform .1s}
.item.sel{outline:4px solid #2196f3;transform:translateY(-4px) scale(1.08)}
.item.zero{opacity:.4;cursor:not-allowed}
.item.hint{animation:armed .35s ease-in-out infinite alternate;outline:4px solid #f9a825}
.item svg{width:100%;height:100%;pointer-events:none}
.item .badge{position:absolute;top:-8px;right:-8px;background:#f44336;color:#fff;font-size:13px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;border:2px solid #fff;padding:0 3px}
.ghost{position:fixed;width:74px;height:74px;transform:translate(-50%,-50%) scale(1.1);pointer-events:none;z-index:300;opacity:.92;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.ghost svg{width:100%;height:100%;background:#a5d6a7;border-radius:12px}
/* ---------- KLASEMEN ---------- */
#lb{align-items:center;justify-content:center;padding:64px 16px 20px}
.lbbox{margin:auto;background:#fff;border:6px solid #ff9800;border-radius:32px;width:min(1200px,100%);overflow:hidden;box-shadow:0 14px 0 rgba(0,0,0,.08),0 20px 30px rgba(0,0,0,.15)}
.lbbox h2{margin:0;background:linear-gradient(#ffb300,#ff9800);color:#fff;text-align:center;padding:20px;font-size:clamp(24px,4vw,36px);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.lbcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;padding:22px;min-height:300px}
.lbcol{background:#fff8e1;border:3px solid #ffe082;border-radius:22px;padding:14px}
.lbcol h3{margin:0 0 12px;text-align:center;color:#e64a19;border-bottom:3px dashed #ffd54f;padding-bottom:10px}
.lbcol .empty{border:2px dashed #ccc;border-radius:14px;padding:16px;color:#888;font-style:italic;font-weight:700}
.lbcol ol{margin:0;padding-left:26px;font-weight:600}
.lbcol li{padding:5px 0}.lbcol li span{float:right;color:#e64a19}
.lbcol li:nth-child(1)::marker{content:'🥇 '}.lbcol li:nth-child(2)::marker{content:'🥈 '}.lbcol li:nth-child(3)::marker{content:'🥉 '}
.lbfoot{background:#f5f5f5;padding:16px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
/* ---------- MODAL ---------- */
#modalRoot .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:200;padding:16px}
.modal{background:#fff;border:8px solid #ffc107;border-radius:34px;padding:24px 32px;width:min(620px,96vw);text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.12);animation:pop2 .3s cubic-bezier(.2,1.6,.4,1);max-height:94vh;overflow:auto}
@keyframes pop2{from{transform:scale(.7);opacity:0}}
.modal h2{margin:0 0 10px;color:#ff5722;font-size:clamp(24px,5vw,34px)}
.modal.blue{border-color:#2196f3}.modal.blue h2{color:#2196f3}
.modal.bad{border-color:#f44336}.modal.bad h2{color:#f44336}
.modal.good{border-color:#4caf50}.modal.good h2{color:#2e7d32}
.modal img.mi.done{height:auto;max-height:36vh;width:min(440px,90%);border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:pop2 .4s}
.modal img.mi{height:120px;max-width:90%;object-fit:contain;margin:4px 0;animation:bob 1.4s ease-in-out infinite}
.modal ul{text-align:left;line-height:1.7;font-size:17px;padding-left:22px}
.modal input{width:100%;padding:14px;font-family:inherit;font-size:20px;border:3px solid #ff9800;border-radius:16px;text-align:center;margin:12px 0}
.modal .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stars{margin:2px 0 6px;min-height:56px}
.stars span{display:inline-block;font-size:46px;filter:grayscale(1) opacity(.3)}
.stars span.on{filter:none;animation:starpop .55s both}
@keyframes starpop{from{transform:scale(0) rotate(-120deg)}70%{transform:scale(1.35) rotate(10deg)}to{transform:scale(1)}}
.rank{text-align:left;margin:10px auto;max-width:380px;font-size:20px;font-weight:600}
.rank div{display:flex;justify-content:space-between;padding:6px 12px;border-radius:12px;margin:4px 0;background:#fff8e1}
.rank div.w{background:#ffe082}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{top:105%;margin-left:50px;transform:rotate(720deg)}}
@media (max-width:820px){
 #top button{width:40px;height:40px;font-size:18px}
 #help{font-size:14px;padding:6px 12px}
 .lvgrid{grid-template-columns:repeat(5,58px);gap:12px;padding:18px}
 .lv{height:62px;font-size:24px;border-width:4px}.lv small{font-size:10px}
 .hud{font-size:20px;height:56px}.hud .exit{font-size:12px;padding:7px 10px}
 .crow{flex-wrap:wrap}.ccard{flex:1 1 40%}.clabel{width:100%;padding:4px}
 .hero img{height:42px}.title span{-webkit-text-stroke:5px #fff}
 .panels{flex-wrap:wrap;align-content:flex-start;gap:10px}
 .panels .panel,.panels.n4 .panel{max-width:none;flex:1 1 44%}
 .panels.n2 .panel{flex:1 1 100%}
 .panels{padding:8px 8px 12px}
 .panels .panel{min-width:0}
 .panels .row{flex-wrap:wrap;justify-content:center;gap:6px}
 .panels .chip{margin:0}
 .panels .rbtn{width:34px;height:34px;font-size:17px}
 .panels.n2{--gs:max(110px,min(64vw,calc((100vh - 470px) / 2)))}
 .panels.n4{--gs:max(90px,min(38vw,calc((100vh - 560px) / 2)))}
 .panels .panel{padding:8px;gap:6px}
 .panels .inv{padding:6px;gap:6px}
 .panels.n2 .item{width:40px!important;height:40px!important}
 .panels.n4 .item{width:34px!important;height:34px!important}
 .panels .tbar{height:20px}
 .lbcols{min-height:0;padding:14px;gap:12px}
 .solo{--gs:min(46vh,86vw);padding:10px}
 .modal{padding:20px 18px}
 #roadstrip{height:96px}#roadstrip .rs-grass{height:34px}#roadstrip .rs-road{top:34px}#roadstrip .rs-dash{top:calc(34px + 5px + 26px)}#roadstrip .rs-scn{font-size:26px;line-height:32px}#roadstrip img.up{bottom:36px;height:32px}#roadstrip img.dn{bottom:6px;height:40px}
}
@media (max-width:560px){
 .hud .hl{display:none}.hud b{font-size:30px}
}
</style>
</head>

let AC=null;const sfx={music:true,sound:true};
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d=.12,type='sine',v=.12,delay=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
const S={
 tick(){if(sfx.sound)tone(520,.07,'square',.06)},
 place(){if(sfx.sound)tone(330,.1,'triangle',.15)},
 remove(){if(sfx.sound)tone(220,.1,'triangle',.12)},
 drive(){if(sfx.sound)tone(180,.1,'sawtooth',.05)},
 hint(){if(sfx.sound){tone(880,.1,'sine',.12);tone(1175,.14,'sine',.12,.1)}},
 win(){if(sfx.sound)[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,i*.09))},
 fail(){if(sfx.sound)[392,330,262,196].forEach((f,i)=>tone(f,.25,'sawtooth',.09,i*.16))},
 end(){if(sfx.sound)[784,659,523,392].forEach((f,i)=>tone(f,.25,'sawtooth',.08,i*.15))}
};

const SIREN_LEN=4.8;
function siren(){
 const a=ac();if(!a)return;const t0=a.currentTime,LO=650,HI=1450;
 const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter(),bp=a.createBiquadFilter();
 o.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=3000;bp.type='peaking';bp.frequency.value=1100;bp.gain.value=6;
 const set=(x,m)=>{
  x.frequency.setValueAtTime(LO*m,t0);
  let t=t0;
  for(let i=0;i<2;i++){x.frequency.exponentialRampToValueAtTime(HI*m,t+1.2);x.frequency.exponentialRampToValueAtTime(LO*m,t+2.4);t+=2.4}
  for(let i=0;i<8;i++){x.frequency.exponentialRampToValueAtTime(HI*m,t+.15);x.frequency.exponentialRampToValueAtTime(LO*m,t+.3);t+=.3}

/* ---------- potongan jalan ---------- */
const DIRS=[{r:-1,c:0},{r:0,c:1},{r:1,c:0},{r:0,c:-1}]; // N E S W
const opp=d=>(d+2)%4;
const TYPES=[[0,2],[1,3],[1,2],[2,3],[3,0],[0,1]]; // V,H,E-S,S-W,W-N,N-E
const EDGE=[[50,0],[100,50],[50,100],[0,50]];
const CORNER={'01':[100,0],'12':[100,100],'23':[0,100],'03':[0,0]};
function roadPath(op){
 if(op.length===1){const[x,y]=EDGE[op[0]];return `M50 50L${x} ${y}`}
 if(op[0]%2===op[1]%2){const[a,b]=EDGE[op[0]],[c,d]=EDGE[op[1]];return `M${a} ${b}L${c} ${d}`}
 const A=EDGE[op[0]],B=EDGE[op[1]],C=CORNER[[op[0],op[1]].sort().join('')];
 const cr=(A[0]-C[0])*(B[1]-C[1])-(A[1]-C[1])*(B[0]-C[0]);
 return `M${A[0]} ${A[1]}A50 50 0 0 ${cr>0?1:0} ${B[0]} ${B[1]}`;
}
function tileSVG(op){
 const p=roadPath(op);
 return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="${p}" fill="none" stroke="#e0e0e0" stroke-width="68"/><path d="${p}" fill="none" stroke="#454545" stroke-width="58"/>${op.length===1?'<circle cx="50" cy="50" r="29" fill="#454545"/>':''}<path d="${p}" fill="none" stroke="#ffc107" stroke-width="3.5" stroke-dasharray="8 6"/></svg>`;
}

/* ---------- generator level ---------- */
function levelTime(level,slots){return Math.min(180,20+8*slots)}
function genLevel(level){
 const rand=rng(level*7919+13);
 let S_=Math.min(7,3+Math.floor(level/4));
 let L=Math.min(level,S_*S_-3);
 for(let attempt=0;attempt<3000;attempt++){
  if(attempt>0&&attempt%500===0)L=Math.max(1,L-1);
  const sr=Math.floor(rand()*S_),sc=Math.floor(rand()*S_);
  const used=new Set([sr+','+sc]);const path=[];let r=sr,c=sc,ok=true;
  const nb=(r,c)=>[0,1,2,3].filter(d=>{const nr=r+DIRS[d].r,nc=c+DIRS[d].c;return nr>=0&&nc>=0&&nr<S_&&nc<S_&&!used.has(nr+','+nc)});
  for(let i=0;i<L;i++){const o=nb(r,c);if(!o.length){ok=false;break}
   const d=o[Math.floor(rand()*o.length)];r+=DIRS[d].r;c+=DIRS[d].c;used.add(r+','+c);path.push({r,c,d})}
  if(!ok)continue;
  const go=nb(r,c);if(!go.length)continue;
  const gd=go[Math.floor(rand()*go.length)];
  const goal={r:r+DIRS[gd].r,c:c+DIRS[gd].c};
  const sdir=path[0].d;
  const need=[0,0,0,0,0,0];const slotIndex={};const sol=[];
  path.forEach((p,i)=>{
   const dIn=p.d;const dOut=i===L-1?gd:path[i+1].d;
   const open=[opp(dIn),dOut];
   const t=TYPES.findIndex(T=>T.includes(open[0])&&T.includes(open[1]));
   need[t]++;sol.push(t);slotIndex[p.r+','+p.c]=i});
  const ex=level<3?0:(level<10?1:2);
  return{S:S_,start:{r:sr,c:sc},sdir,goal,gd,slots:path,slotIndex,sol,counts:need.map(n=>n+ex)};
 }
 return{S:3,start:{r:1,c:0},sdir:1,goal:{r:1,c:2},gd:1,slots:[{r:1,c:1,d:1}],slotIndex:{'1,1':0},sol:[1],counts:[0,1,0,0,0,0]};
}

/* ---------- papan permainan ---------- */
const DECO=['🌳','🌲','🌼','🌷','🍄','🌻','🐑','🐥','🌴','🪨','🦆','🌺'];
class Board{
 constructor(host,cb,theme){
  this.host=host;this.cb=cb;this.theme=theme;this.sel=null;this.locked=true;this.state='idle';this.paused=false;this.run=0;this.dead=false;
  host.innerHTML='<div class="tbar"><div class="tfill"></div><span class="ttxt"></span></div><div class="grid"></div><div class="inv"></div>';
  host.style.cssText='display:flex;flex-direction:column;align-items:center;gap:10px;width:100%';
  this.gridEl=$('.grid',host);this.invEl=$('.inv',host);
  this.gridEl.addEventListener('click',e=>{
   const s=e.target.closest('.slot');if(!s||this.locked)return;const i=+s.dataset.i;
   if(this.placed[i]!=null)this.remove(i);else if(this.sel!=null)this.place(i,this.sel)});
  this.invEl.addEventListener('pointerdown',e=>this.drag(e));
  this.lastT=performance.now();
  this.timer=setInterval(()=>this.step(),100);
 }
 destroy(){this.dead=true;this.run++;clearInterval(this.timer)}
 pause(v){this.paused=v;this.lastT=performance.now()}
 load(level){
  this.run++;this.level=level;this.L=genLevel(level);this.left=[...this.L.counts];
  this.placed=this.L.slots.map(()=>null);this.sel=null;this.locked=false;this.state='play';this.paused=false;
  this.limit=levelTime(level,this.L.slots.length)*1000;this.remain=this.limit;this.lastT=performance.now();
  this.renderGrid();this.renderInv();this.drawTime();
 }
 reset(){this.load(this.level)}
 step(){
  const now=performance.now(),dt=now-this.lastT;this.lastT=now;
  if(this.dead||this.state!=='play'||this.paused)return;
  this.remain-=dt;
  if(this.remain<=0){this.remain=0;this.drawTime();this.fail();return}
  this.drawTime();
 }
 drawTime(){
  const p=Math.max(0,this.remain/this.limit),f=$('.tfill',this.host);
  f.style.width=(p*100)+'%';f.style.background=p>.5?'#4caf50':p>.25?'#ff9800':'#f44336';f.classList.toggle('blink',p<=.2&&this.state==='play');
  const s=Math.ceil(this.remain/1000);$('.ttxt',this.host).textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 }
 cellPos(p){const n=this.L.S;return{left:(p.c*100/n)+'%',top:(p.r*100/n)+'%'}}
 renderGrid(){
  const L=this.L,g=this.gridEl,T=this.theme,dr=rng(this.level*131+7);g.style.setProperty('--n',L.S);g.innerHTML='';
  for(let r=0;r<L.S;r++)for(let c=0;c<L.S;c++){
   const d=document.createElement('div');
   if(r===L.start.r&&c===L.start.c){d.className='cell';d.innerHTML=tileSVG([L.sdir])}
   else if(r===L.goal.r&&c===L.goal.c){d.className='cell goal';d.innerHTML=tileSVG([opp(L.gd)])+`<img class="dest" src="${T.dest}" alt=""><div class="sos">${T.sos}</div>`}
   else if(L.slotIndex[r+','+c]!=null){const i=L.slotIndex[r+','+c];d.className='slot';d.dataset.i=i;d.innerHTML='<div class="ph">?</div>'}
   else{d.className='cell';if(dr()<.5){const e=document.createElement('div');e.className='deco';e.textContent=DECO[Math.floor(dr()*DECO.length)];e.style.animationDelay=(dr()*3)+'s';d.appendChild(e)}else dr()}
   g.appendChild(d)}
  const car=document.createElement('img');car.className='car idle';car.src=T.car;car.alt='';
  car.style.width='calc(100% / '+L.S+')';car.style.height='calc(100% / '+L.S+')';
  const pos=this.cellPos(L.start);car.style.left=pos.left;car.style.top=pos.top;
  if(L.sdir===3)car.style.setProperty('--f','-1');
  g.appendChild(car);this.car=car;
 }
 slotEl(i){return this.gridEl.querySelector(`.slot[data-i="${i}"]`)}
 renderInv(){
  this.gridEl.classList.toggle('armed',this.sel!=null);
  this.invEl.innerHTML=TYPES.map((t,i)=>`<div class="item ${this.left[i]<=0?'zero':''} ${this.sel===i?'sel':''}" data-t="${i}">${tileSVG(t)}<span class="badge">${this.left[i]}</span></div>`).join('');
 }
 hint(){
  if(this.locked||this.state!=='play')return;
  const L=this.L;let bad=this.placed.findIndex((t,i)=>t!=null&&t!==L.sol[i]);
  let i=bad>=0?bad:this.placed.findIndex(t=>t==null);if(i<0)return;
  S.hint();const el=this.slotEl(i);el.classList.add('hint');
  let it=null;if(bad<0){it=this.invEl.querySelector(`.item[data-t="${L.sol[i]}"]`);it&&it.classList.add('hint')}
  setTimeout(()=>{el.classList.remove('hint');it&&it.classList.remove('hint')},2600);
  toast(bad>=0?'Potongan ini salah, ketuk untuk menghapus 🔄':'Pasang potongan yang berkedip di kotak kuning 💡');
 }
 place(i,t){
  if(this.locked||this.placed[i]!=null||this.left[t]<=0)return;
  this.placed[i]=t;this.left[t]--;const el=this.slotEl(i);el.classList.remove('hint');el.innerHTML=tileSVG(TYPES[t]);
  this.sel=null;
  S.place();this.renderInv();
  if(this.check())this.win();
 }
 remove(i){
  const t=this.placed[i];if(t==null)return;this.placed[i]=null;this.left[t]++;
  this.slotEl(i).innerHTML='<div class="ph">?</div>';S.remove();this.renderInv();
 }
 check(){
  const L=this.L;let{r,c}=L.start,d=L.sdir;
  for(let n=0;n<200;n++){
   r+=DIRS[d].r;c+=DIRS[d].c;
   if(r===L.goal.r&&c===L.goal.c)return d===L.gd;
   const i=L.slotIndex[r+','+c];if(i==null||this.placed[i]==null)return false;
   const op=TYPES[this.placed[i]],inD=opp(d);if(!op.includes(inD))return false;
   d=op[0]===inD?op[1]:op[0];
  }
  return false;
 }
 async win(){
  this.locked=true;this.state='won';const id=++this.run;const L=this.L;
  const pr=this.remain/this.limit,stars=pr>=.5?3:pr>=.25?2:1;
  this.car.classList.remove('idle');
  const sos=$('.sos',this.gridEl);sos&&sos.remove();
  const pts=[L.start,...L.slots,L.goal];
  for(let i=1;i<pts.length;i++){
   if(this.dead||id!==this.run)return;
   const p=pts[i],q=pts[i-1],pos=this.cellPos(p);
   const pf=document.createElement('div');pf.className='puff';pf.textContent='💨';const qp=this.cellPos(q);
   pf.style.left=qp.left;pf.style.top=qp.top;pf.style.width=pf.style.height='calc(100% / '+L.S+')';this.gridEl.appendChild(pf);setTimeout(()=>pf.remove(),750);
   if(p.c<q.c)this.car.style.setProperty('--f','-1');else if(p.c>q.c)this.car.style.setProperty('--f','1');
   this.car.style.left=pos.left;this.car.style.top=pos.top;S.drive();
   await sleep(300);
  }
  if(this.dead||id!==this.run)return;
  S.win();
  const g=$('.goal',this.gridEl);if(g){$('.dest',g).classList.add('happy');const b=document.createElement('div');b.className='burst';b.textContent='✨';g.appendChild(b)}
  await sleep(850);
  if(this.dead||id!==this.run)return;
  this.cb.onSolve&&this.cb.onSolve(Math.ceil(this.remain/1000),stars);
 }
 async fail(){
  this.locked=true;this.state='failed';const id=++this.run;
  this.sel=null;this.renderInv();S.fail();
  const sos=$('.sos',this.gridEl);sos&&sos.remove();
  const g=$('.goal',this.gridEl);if(g){const im=$('.dest',g);im.src=this.theme.fail;im.classList.add('shake')}
  this.car.classList.remove('idle');this.car.classList.add('shake');
  await sleep(1100);
  if(this.dead||id!==this.run)return;
  this.cb.onFail&&this.cb.onFail();
 }
 drag(e){
  const it=e.target.closest('.item');if(!it||this.locked)return;
  const t=+it.dataset.t;if(this.left[t]<=0)return;
  e.preventDefault();const sx=e.clientX,sy=e.clientY;let ghost=null;
  const mv=ev=>{
   if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=tileSVG(TYPES[t]);document.body.appendChild(ghost)}
   if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'}};
  const up=ev=>{
   window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
   if(ghost){ghost.remove();const el=document.elementFromPoint(ev.clientX,ev.clientY);const s=el&&el.closest&&el.closest('.slot');
    if(s&&this.gridEl.contains(s)){const i=+s.dataset.i;if(this.placed[i]==null)this.place(i,t)}}
   else{this.sel=this.sel===t?null:t;S.tick();this.renderInv()}
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
 }
}

  onFail:()=>{
   const m=modal(`<h2>GAGAL! ⏰ WAKTU HABIS</h2><img class="mi" src="${T.fail}" alt=""><p style="font-weight:600;margin:4px 0">${T.lose}</p><div class="btns"><button class="big green" id="r">COBA LAGI 🔄</button><button class="big orange" id="l">PILIH LEVEL</button></div>`,'bad');
   $('#r',m).onclick=()=>{m.close();load()};$('#l',m).onclick=()=>{m.close();openLevels()};
  }
 },T);
 const load=()=>{$('#sLvl').textContent=T.icon+' Level '+cur;board.load(cur)};
 load();
 $('#sHome').onclick=()=>{S.tick();stopSession();show('menu')};
 $('#sLv').onclick=()=>{S.tick();openLevels()};
 $('#sReset').onclick=()=>{S.tick();board.reset()};
 $('#sHint').onclick=()=>board.hint();
 $('#sFin').onclick=()=>finishSolo(Math.max(best,cur));
 function finishSolo(lv){
  board.pause(true);
  const m=modal(`<h2>SELESAI BERMAIN? 🏳️</h2><p style="font-weight:600">Hebat! Kamu mencapai Level ${lv}. Simpan rekormu yuk!</p><input id="nm" maxlength="20" placeholder="Masukkan Namamu..."><div class="btns"><button class="big blue" id="sv">SIMPAN &amp; KELUAR 🏆</button><button class="big green" id="cn">BATAL</button></div>`);
  $('#cn',m).onclick=()=>{m.close();board.pause(false)};
  $('#sv',m).onclick=()=>{const n=$('#nm',m).value.trim()||'Pahlawan';addLB('solo',n,lv);m.close();confetti(40);openLB()};
 }
 session={stop(){board.destroy()}};
}

/* ---------- MULTI ---------- */
function startMulti(n,themes){
 stopSession();show('game');const G=$('#game');G.style.alignItems='stretch';G.style.justifyContent='flex-start';G.style.paddingTop='0';
 const DUR=180000;let over=false,pausedAt=null;
 G.innerHTML=`<div class="hud"><button class="exit" id="mExit">⬅ KELUAR</button><span class="hl">WAKTU SISA:</span> <b id="tm">03:00</b></div><div class="panels n${n}" id="pan"></div>`;
 const players=[];
 const upd=pl=>{const k=players.indexOf(pl)+1;$('.chip',pl.p).textContent=n>2?`${pl.theme.icon} P${k} · Lv ${pl.level}`:`${pl.theme.icon} Pemain ${k} - Lvl ${pl.level}`;$('.score',pl.p).textContent='Skor: '+pl.score};
 for(let i=0;i<n;i++){
  const p=document.createElement('div');p.className='panel pl';p.style.setProperty('--pc',PC[i]);
  p.innerHTML=`<div class="row"><button class="rbtn" title="Ulangi">↻</button><div class="chip"></div><span class="score"></span></div><div class="bh"></div>`;
  $('#pan').appendChild(p);
  const pl={level:1,score:0,p,theme:themes[i]};
  pl.board=new Board($('.bh',p),{
   onSolve:rem=>{if(over)return;pl.score+=10*pl.level+10+Math.floor(rem/5);pl.level=Math.min(20,pl.level+1);upd(pl);toast(`🎉 Pemain ${i+1} naik ke Level ${pl.level}!`);pl.board.load(pl.level)},
   onFail:()=>{if(over)return;pl.board.load(pl.level)}
  },themes[i]);
  $('.rbtn',p).onclick=()=>{S.tick();if(!over&&pausedAt==null)pl.board.reset()};
  players.push(pl);upd(pl);
 }
 players.forEach(pl=>pl.board.load(1));
 let end=Date.now()+DUR;
 const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
 const iv=setInterval(()=>{if(pausedAt!=null)return;const left=end-Date.now();$('#tm').textContent=fmt(left);if(left<=0&&!over)finish()},200);
 const pauseAll=v=>{if(v){pausedAt=Date.now()}else if(pausedAt!=null){end+=Date.now()-pausedAt;pausedAt=null}players.forEach(p=>p.board.pause(v))};
 function finish(){
  over=true;clearInterval(iv);players.forEach(p=>{p.board.locked=true;p.board.state='idle';p.board.run++});S.end();
  const rank=players.map((p,i)=>({i:i+1,score:p.score,icon:p.theme.icon})).sort((a,b)=>b.score-a.score);
  const top=rank[0].score;const tie=rank.filter(r=>r.score===top).length>1&&top>0;
  const title=top===0?'WAKTU HABIS! GAGAL ⏰':tie?'WAKTU HABIS - SERI! 🤝':`PEMAIN ${rank[0].i} MENANG! 🏆`;
  if(top>0)confetti();
  const m=modal(`<h2>${title}</h2><div class="rank">${rank.map((r,k)=>`<div class="${r.score===top&&top>0?'w':''}"><span>${['🥇','🥈','🥉','4️⃣'][k]} ${r.icon} Pemain ${r.i}</span><span>${r.score}</span></div>`).join('')}</div><input id="nm" maxlength="20" placeholder="Nama juara..."><div class="btns"><button class="big blue" id="sv">SIMPAN &amp; KELUAR 🏆</button><button class="big green" id="ag">MAIN LAGI</button><button class="big red" id="mn">MENU</button></div>`,top===0?'bad':'good');
  $('#sv',m).onclick=()=>{const nm=$('#nm',m).value.trim()||('Pemain '+rank[0].i);addLB(n===2?'duel':'squad',nm,top);m.close();stopSession();openLB()};
  $('#ag',m).onclick=()=>{m.close();startMulti(n,themes)};
  $('#mn',m).onclick=()=>{m.close();stopSession();show('menu')};
 }
 $('#mExit').onclick=()=>{S.tick();if(over)return;pauseAll(true);
  ask('KELUAR? 🚪','Permainan akan berhenti dan skor tidak disimpan.','YA, KELUAR',()=>{stopSession();show('menu')},()=>pauseAll(false))};
 session={stop(){clearInterval(iv);over=true;players.forEach(p=>p.board.destroy())}};
}

/* ---------- klasemen ---------- */
function addLB(kind,name,val){const d=LS.get('si_lb',{solo:[],duel:[],squad:[]});d[kind].push({name,val,date:new Date().toLocaleDateString('id-ID')});
 d[kind].sort((a,b)=>b.val-a.val);d[kind]=d[kind].slice(0,10);LS.set('si_lb',d)}
function openLB(){
 stopSession();show('lb');const d=LS.get('si_lb',{solo:[],duel:[],squad:[]});
 const cols=[['🚗 Rekor Solo','solo','Level'],['⚔️ Juara Duel','duel','Skor'],['👥 Juara Squad','squad','Skor']];
 $('#lbcols').innerHTML=cols.map(([t,k,u])=>`<div class="lbcol"><h3>${t}</h3>${d[k].length?`<ol>${d[k].map(e=>`<li>${esc(e.name)} <span>${u} ${e.val}</span></li>`).join('')}</ol>`:'<div class="empty">Belum ada<br>Pahlawan</div>'}</div>`).join('');
}
$('#lbBack').onclick=()=>{S.tick();show('menu')};
$('#lbDel').onclick=()=>{S.tick();ask('HAPUS SEMUA DATA? 🗑️','Klasemen, bintang, dan level yang terbuka akan kembali seperti awal.','YA, HAPUS',()=>{LS.set('si_lb',{solo:[],duel:[],squad:[]});LS.set('si_unlock',1);LS.set('si_stars',{});openLB();toast('Semua data sudah dihapus ✅')})};
$('#lbDl').onclick=()=>{
 S.tick();
 const d=LS.get('si_lb',{solo:[],duel:[],squad:[]});const names={solo:'Solo (Level)',duel:'Duel (Skor)',squad:'Squad (Skor)'};
 let csv='﻿Mode,Peringkat,Nama,Nilai,Tanggal\n',cnt=0;
 for(const k of ['solo','duel','squad'])d[k].forEach((e,i)=>{cnt++;csv+=`${names[k]},${i+1},"${e.name.replace(/"/g,'""')}",${e.val},${e.date}\n`});
 try{
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='klasemen-siaga-darurat.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast(cnt?'Data diunduh ✅ (buka dengan Excel)':'Belum ada data, file kosong diunduh');
 }catch(e){toast('Gagal mengunduh data 🙁')}
};
show('menu');
</script>
</body>
